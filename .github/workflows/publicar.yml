# Publica la API estática en GitHub Pages en cada push a main.
# Requiere: Settings → Pages → Source: "GitHub Actions".
name: Publicar API

on:
  push:
    branches: [main]
    # Las reservas y las propuestas de glosario no cambian la API.
    paths-ignore:
      - 'reservas/**'
      - 'glosario-propuestas/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Una publicación a la vez. No se corta la que está en curso (cortarla dejaba
# publicaciones fallidas); de las que esperan, GitHub conserva solo la última.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Originales y textos bíblicos descargados de bible.helloao.org (se renuevan cada semana)
      - id: semana
        run: echo "valor=$(date +%G-%V)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: fuentes
          key: fuentes-${{ steps.semana.outputs.valor }}
          restore-keys: fuentes-
      - name: Pruebas
        run: node --test 'scripts/*.test.mjs'
      - name: Validar traducciones
        run: node scripts/validar.mjs --todos --citas-como-aviso
      - name: Construir API
        run: node scripts/construir-api.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/api
      - id: deployment
        uses: actions/deploy-pages@v4
